version: 2
updates:
  # Python dependencies. Must be "uv", not "pip": the pip ecosystem only edits
  # pyproject.toml and leaves uv.lock alone, so a widened version range resolves
  # straight back to the stale pinned version and CI silently validates nothing
  # (see PR #25). The uv ecosystem updates pyproject.toml and uv.lock together.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    groups:
      python-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions used in workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
