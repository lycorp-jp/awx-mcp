name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --dev
      - name: Doc parity check
        run: uv run python scripts/check_doc_parity.py
      - name: Type check
        run: uv run mypy awx_mcp/
      - name: Test
        env:
          ANSIBLE_BASE_URL: "https://awx.example.com/"
          ANSIBLE_TOKEN: "fake-token-for-ci"
          ANSIBLE_SSL_VERIFY: "false"
        run: >-
          uv run pytest tests/ -v --cov=awx_mcp --cov-fail-under=100
          --cov-report=term-missing --cov-report=xml --cov-report=json
      - name: Preserve combined coverage records
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-python-${{ matrix.python-version }}
          path: |
            coverage.xml
            coverage.json
          retention-days: 14
