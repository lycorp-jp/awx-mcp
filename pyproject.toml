[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "awx-mcp"
version = "1.0.0"
description = "MCP server for AWX/Ansible Tower — 145 tools (141 default + 4 opt-in) for REST API v2"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "argon (LY Corporation)", email = "dl_oss_dev@lycorp.co.jp" },
]
keywords = [
    "mcp",
    "mcp-server",
    "model-context-protocol",
    "ansible",
    "awx",
    "ansible-tower",
    "automation",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = [
    # Upper bound: passthrough mode reads the inbound request off the lowlevel
    # ServerRequestContext (`ctx.request`), which the SDK annotates loosely — pin
    # the major so `uv sync` cannot silently move it. Lower bound tracks upstream
    # (bumped to 2.0.0 by dependabot #32; see CHANGELOG for the 1.x -> 2.x port).
    "mcp>=2.0.0,<3",
    "requests>=2.34.2",
    # Used directly by the proxy (awx-mcp --remote) to inject the caller's token
    # header. mcp 2.x moved its HTTP stack to httpx2, and the proxy hands its own
    # client to `streamable_http_client`, so the client must be an httpx2 one.
    "httpx2>=2.10.0",
]

[project.urls]
Homepage = "https://github.com/lycorp-jp/awx-mcp"
Repository = "https://github.com/lycorp-jp/awx-mcp"
Documentation = "https://github.com/lycorp-jp/awx-mcp#readme"
"Bug Tracker" = "https://github.com/lycorp-jp/awx-mcp/issues"
Changelog = "https://github.com/lycorp-jp/awx-mcp/blob/main/CHANGELOG.md"

[project.scripts]
awx-mcp = "awx_mcp:main"

[tool.hatch.build.targets.wheel]
packages = ["awx_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["awx_mcp"]
patch = ["subprocess"]
sigterm = true

[tool.coverage.report]
fail_under = 100
precision = 2
show_missing = true

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# RUF013: no implicit Optional (`x: str = None`) — it renders as a JSON Schema
# whose type ("string") contradicts its default (null) in tools/list.
select = ["E", "F", "I", "UP", "RUF013"]

[tool.mypy]
python_version = "3.10"
files = ["awx_mcp/"]
ignore_missing_imports = true
no_implicit_optional = true
warn_unused_ignores = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7",
    "coverage[toml]>=7.10.6",
    "ruff>=0.16.3,<0.18",
    "mypy==2.4.1",
    "types-requests>=2.33.0.20260712",
    "responses>=0.26.2",
]
